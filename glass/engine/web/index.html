<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glass Local Vision</title>
  <style>
    :root { color: #17202a; background: #f1f4f6; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(1100px, calc(100% - 32px)); margin: 24px auto; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; border-bottom: 1px solid #cbd5dc; padding-bottom: 14px; }
    h1 { margin: 0; font-size: 24px; }
    .subtitle, #status { color: #52606d; font-size: 14px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 16px; margin-top: 16px; }
    .surface { background: #fff; border: 1px solid #cbd5dc; border-radius: 6px; padding: 14px; }
    #video { display: block; width: 100%; min-height: 300px; max-height: 70vh; object-fit: contain; background: #101820; }
    label { display: block; font-size: 13px; font-weight: 650; margin: 12px 0 5px; }
    input, select, button { width: 100%; min-height: 38px; font: inherit; border: 1px solid #aebbc5; border-radius: 4px; padding: 7px 9px; }
    button { cursor: pointer; background: #0f6b78; border-color: #0f6b78; color: #fff; font-weight: 650; margin-top: 12px; }
    button.secondary { background: #fff; color: #173c45; }
    button:disabled { cursor: wait; opacity: .6; }
    .result { border-top: 1px solid #d9e0e5; padding: 9px 0; }
    .result:first-child { border-top: 0; }
    .confidence { float: right; color: #52606d; }
    .empty { color: #667781; font-size: 14px; }
    @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } #video { min-height: 220px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>本地视觉识别</h1>
      <div class="subtitle">XIAO OV3660 -> 本机 YOLO</div>
    </header>
    <div class="layout">
      <section class="surface">
        <img id="video" alt="等待识别画面">
        <div id="status">填写设备地址后开始识别。</div>
      </section>
      <aside class="surface">
        <label for="deviceUrl">ESP32 地址</label>
        <input id="deviceUrl" value="http://192.168.1.11" spellcheck="false">
        <label for="frameSize">原始帧尺寸</label>
        <select id="frameSize"><option value="160x120">160 x 120</option><option value="320x240">320 x 240</option></select>
        <label for="confidence">最低置信度</label>
        <input id="confidence" type="number" min="0.05" max="0.95" step="0.05" value="0.35">
        <button id="start" type="button">开始本地识别</button>
        <button id="single" class="secondary" type="button">识别单帧</button>
        <label>当前检测</label>
        <div id="results" class="empty">尚未检测到目标。</div>
      </aside>
    </div>
  </main>
  <script>
    const video = document.querySelector('#video');
    const status = document.querySelector('#status');
    const results = document.querySelector('#results');
    const start = document.querySelector('#start');
    const single = document.querySelector('#single');
    let polling = 0;

    function config() {
      return { device_url: deviceUrl.value, frame_size: frameSize.value, confidence: Number(confidence.value) };
    }
    async function request(url, options) {
      const response = await fetch(url, options);
      const body = await response.json();
      if (!response.ok) throw new Error(body.detail || ('HTTP ' + response.status));
      return body;
    }
    function render(items) {
      results.replaceChildren();
      if (!items.length) { results.textContent = '未检测到目标。'; results.className = 'empty'; return; }
      results.className = '';
      for (const item of items) {
        const row = document.createElement('div');
        row.className = 'result';
        row.textContent = item.label;
        const confidence = document.createElement('span');
        confidence.className = 'confidence';
        confidence.textContent = Math.round(item.confidence * 100) + '%';
        row.append(confidence);
        results.append(row);
      }
    }
    async function refreshStatus() {
      try {
        const data = await request('/api/status');
        render(data.detections);
        if (data.last_error) status.textContent = '连接或识别错误：' + data.last_error;
      } catch (error) { status.textContent = '状态读取失败：' + error.message; }
    }
    async function applyConfig() {
      return request('/api/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(config()) });
    }
    start.addEventListener('click', async () => {
      start.disabled = true;
      status.textContent = '正在连接摄像头并加载本地 YOLO…';
      try {
        await applyConfig();
        video.src = '/api/stream?ts=' + Date.now();
        status.textContent = '本地识别中。首帧加载和模型首次下载可能需要一些时间。';
        clearInterval(polling);
        polling = setInterval(refreshStatus, 1000);
      } catch (error) { status.textContent = '启动失败：' + error.message; }
      finally { start.disabled = false; }
    });
    single.addEventListener('click', async () => {
      single.disabled = true;
      status.textContent = '正在获取并识别一帧…';
      try {
        await applyConfig();
        const data = await request('/api/detect', { method: 'POST' });
        video.src = data.image_url;
        render(data.detections);
        status.textContent = '单帧识别完成。';
      } catch (error) { status.textContent = '单帧识别失败：' + error.message; }
      finally { single.disabled = false; }
    });
  </script>
</body>
</html>
